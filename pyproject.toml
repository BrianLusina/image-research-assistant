[project]
name = "image-research-assistant"
version = "0.1.0"
description = "A multimodal image research AI assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=2.14.0",
    "gradio>=6.20.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.10",
    "mcp>=2.0.0",
    "uvicorn>=0.51.0",
    "wikipedia>=1.4.0",
]

[dependency-groups]
lint = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.1",
]
